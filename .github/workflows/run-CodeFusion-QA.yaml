name: Run CodeFusion QA 1

on:
  workflow_dispatch:

jobs:
  codefusion:
    runs-on: ubuntu-latest
    env:
      CODEFUSION_IMAGE: whoicd/codefusion:1.1.1
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Cache CodeFusion classifications
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/codefusion-cache
          key: codefusion-classifications-${{ runner.os }}-${{ runner.arch }}-1.1.1-${{ hashFiles('parameters.json') }}

      - name: Run CodeFusion
        run: |
          set -euo pipefail

          rm -rf output
          mkdir -p output "$RUNNER_TEMP/codefusion-cache"

          mapfile -d '' input_files < <(
            find input -type f \( -iname '*.txt' -o -iname '*.xlsx' \) -print0
          )

          if (( ${#input_files[@]} == 0 )); then
            echo "No .txt or .xlsx files found in input/" >&2
            exit 1
          fi

          for index in "${!input_files[@]}"; do
            input_path="${input_files[$index]}"
            relative_path="${input_path#input/}"
            relative_dir="$(dirname "$relative_path")"
            input_name="$(basename "$input_path")"
            work_dir="$RUNNER_TEMP/codefusion-$index"
            input_dir="$work_dir/input"
            config_dir="$work_dir/config"
            destination="output/$relative_dir"

            mkdir -p "$input_dir" "$config_dir" "$destination"
            cp "$input_path" "$input_dir/$input_name"

            INPUT_FILE="/input/$input_name" perl -pe '
              if (/^(\s*"inputFile"\s*:\s*)"(?:\\.|[^"])*"/) {
                $value = $ENV{"INPUT_FILE"};
                $value =~ s/\\/\\\\/g;
                $value =~ s/"/\\"/g;
                s/^(\s*"inputFile"\s*:\s*)"(?:\\.|[^"])*"/$1"$value"/;
              }
            ' parameters.json > "$config_dir/parameters.json"

            docker run --rm \
              -v "$input_dir:/input" \
              -v "$config_dir:/app/CodeFusionFiles" \
              -v "$RUNNER_TEMP/codefusion-cache:/app/CodeFusionFiles/cache" \
              "$CODEFUSION_IMAGE"

            result_count=0

          # QA Recommendations:
          # 1. Ensure that the CODEFUSION_IMAGE is up to date.
          # 2. Validate input files before processing.
          # 3. Add logging for better traceability.


            for result in "$input_dir"/*; do
              if [[ -f "$result" && "$(basename "$result")" != "$input_name" ]]; then
                cp "$result" "$destination/"
                ((result_count += 1))
              fi
            done

            if (( result_count == 0 )); then
              echo "CodeFusion produced no output for $input_path." >&2
              exit 1
            fi
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codefusion-results
          path: output/
          if-no-files-found: error

      - name: Create output pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output/

          if git diff --cached --quiet; then
            echo "CodeFusion output is unchanged; skipping pull request."
            exit 0
          fi

          timestamp="$(date -u +'%Y%m%d-%H%M%S')"
          branch="output-$timestamp-${GITHUB_RUN_ID}"

          git switch -c "$branch"
          git commit -m "Add CodeFusion output ($timestamp UTC)"
          git push --set-upstream origin "$branch"

          cat > "$RUNNER_TEMP/pull-request-body.md" <<EOF
          CodeFusion output generated by workflow run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          ## Manual QA

          - [ ] Download or inspect the generated files in \`output/\`.
          - [ ] Compare each result with its source file in \`input/\`.
          - [ ] Review matches that are not marked \`GoodMatch\`.
          - [ ] Confirm the output is safe to merge.
          EOF

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "Review CodeFusion output ($timestamp UTC)" \
            --body-file "$RUNNER_TEMP/pull-request-body.md"